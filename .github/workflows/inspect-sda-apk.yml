name: Inspect original SDA APK (read-only)

on:
  push:
    branches: [main]
    paths:
      - "work/GuiApp.apk"
      - "work/GuiApp.apk.part1"
      - "work/GuiApp.apk.part2"
      - ".github/workflows/inspect-sda-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  disassemble:
    runs-on: ubuntu-latest
    steps:
      - name: Check out private analysis repository
        uses: actions/checkout@v4

      - name: Reassemble and check input APK
        shell: bash
        run: |
          if [ ! -f work/GuiApp.apk ]; then
            test -f work/GuiApp.apk.part1 || { echo "::error::Missing work/GuiApp.apk.part1"; exit 1; }
            test -f work/GuiApp.apk.part2 || { echo "::error::Missing work/GuiApp.apk.part2"; exit 1; }
            cat work/GuiApp.apk.part1 work/GuiApp.apk.part2 > work/GuiApp.apk
          fi
          echo "7155c4429bee06cc2066c6500b3ae5afa9e7d2187303e1cd62738abbed0c0ad8  work/GuiApp.apk" | sha256sum -c -
          unzip -t work/GuiApp.apk

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Extract DEX and disassemble with Baksmali
        shell: bash
        run: |
          mkdir -p analysis
          unzip -Z1 work/GuiApp.apk | grep -E '^classes([0-9]+)?\.dex$' | sort -V > analysis/dex-list.txt
          test -s analysis/dex-list.txt || { echo "::error::No classes*.dex found"; exit 1; }
          cat > analysis/pom.xml <<'POM'
          <project xmlns="http://maven.apache.org/POM/4.0.0">
            <modelVersion>4.0.0</modelVersion>
            <groupId>local.analysis</groupId>
            <artifactId>outlander-apk-analysis</artifactId>
            <version>1.0</version>
            <dependencies>
              <dependency>
                <groupId>org.smali</groupId>
                <artifactId>baksmali</artifactId>
                <version>2.5.2</version>
              </dependency>
            </dependencies>
          </project>
          POM
          mvn --batch-mode --quiet -f analysis/pom.xml org.apache.maven.plugins:maven-dependency-plugin:3.8.1:build-classpath -Dmdep.outputFile=analysis/classpath.txt
          while IFS= read -r dex; do
            mkdir -p "analysis/raw/$(dirname "$dex")"
            unzip -p work/GuiApp.apk "$dex" > "analysis/raw/$dex"
            name="${dex%.dex}"
            mkdir -p "analysis/smali/$name"
            curl --fail --location --silent --show-error \
              https://repo.maven.apache.org/maven2/org/smali/baksmali/2.5.2/baksmali-2.5.2.jar \
              -o analysis/baksmali.jar
            java -cp "$(cat analysis/classpath.txt)" org.jf.baksmali.Main disassemble "analysis/raw/$dex" -o "analysis/smali/$name"
          done < analysis/dex-list.txt
          {
            echo "APK SHA-256:"
            sha256sum work/GuiApp.apk
            echo
            echo "DEX files:"
            cat analysis/dex-list.txt
            echo
            echo "Target classes:"
            find analysis/smali -type f | grep -E 'EntDab(Library|Model|PresetController|PresetList)|HardKey' | sort || true
          } > analysis/REPORT.txt

      - name: Upload disassembly for review
        uses: actions/upload-artifact@v4
        with:
          name: outlander-sda-smali-analysis
          path: |
            analysis/REPORT.txt
            analysis/dex-list.txt
            analysis/smali/
          retention-days: 7
