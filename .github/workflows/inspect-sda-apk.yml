name: Inspect original SDA APK (read-only)

on:
  push:
    branches: [main]
    paths:
      - "work/GuiApp.apk"
      - ".github/workflows/inspect-sda-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  disassemble:
    runs-on: ubuntu-latest
    steps:
      - name: Check out private analysis repository
        uses: actions/checkout@v4

      - name: Check input APK
        shell: bash
        run: |
          test -f work/GuiApp.apk || { echo "::error::Missing work/GuiApp.apk. Upload the original APK as described in README."; exit 1; }
          sha256sum work/GuiApp.apk | tee apk-sha256.txt
          unzip -t work/GuiApp.apk

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Extract DEX and disassemble with Baksmali
        shell: bash
        run: |
          mkdir -p analysis
          unzip -Z1 work/GuiApp.apk | grep -E '^classes([0-9]+)?\\.dex$' | sort -V > analysis/dex-list.txt
          test -s analysis/dex-list.txt || { echo "::error::No classes*.dex found"; exit 1; }
          while IFS= read -r dex; do
            mkdir -p "analysis/raw/$(dirname "$dex")"
            unzip -p work/GuiApp.apk "$dex" > "analysis/raw/$dex"
            name="${dex%.dex}"
            mkdir -p "analysis/smali/$name"
            curl --fail --location --silent --show-error \
              https://repo.maven.apache.org/maven2/org/smali/baksmali/2.5.2/baksmali-2.5.2.jar \
              -o analysis/baksmali.jar
            java -jar analysis/baksmali.jar disassemble "analysis/raw/$dex" -o "analysis/smali/$name"
          done < analysis/dex-list.txt
          {
            echo "APK SHA-256:"
            cat apk-sha256.txt
            echo
            echo "DEX files:"
            cat analysis/dex-list.txt
            echo
            echo "Target classes:"
            find analysis/smali -type f | grep -E 'EntDab(Library|Model|PresetController|PresetList)|HardKey' | sort || true
          } > analysis/REPORT.txt

      - name: Upload disassembly for review
        uses: actions/upload-artifact@v4
        with:
          name: outlander-sda-smali-analysis
          path: |
            analysis/REPORT.txt
            analysis/dex-list.txt
            analysis/smali/
            apk-sha256.txt
          retention-days: 7
