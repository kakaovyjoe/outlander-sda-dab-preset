name: Inspect original SDA APK (read-only)

on:
  push:
    branches: [main]
    paths:
      - "work/GuiApp.apk"
      - "work/GuiApp.apk.part1"
      - "work/GuiApp.apk.part2"
      - "tools/patch_dab_presets.py"
      - ".github/workflows/inspect-sda-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  disassemble:
    runs-on: ubuntu-latest
    steps:
      - name: Check out private analysis repository
        uses: actions/checkout@v4

      - name: Reassemble and check input APK
        shell: bash
        run: |
          if [ ! -f work/GuiApp.apk ]; then
            test -f work/GuiApp.apk.part1 || { echo "::error::Missing work/GuiApp.apk.part1"; exit 1; }
            test -f work/GuiApp.apk.part2 || { echo "::error::Missing work/GuiApp.apk.part2"; exit 1; }
            cat work/GuiApp.apk.part1 work/GuiApp.apk.part2 > work/GuiApp.apk
          fi
          echo "7155c4429bee06cc2066c6500b3ae5afa9e7d2187303e1cd62738abbed0c0ad8  work/GuiApp.apk" | sha256sum -c -
          unzip -t work/GuiApp.apk

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Extract DEX and disassemble with Baksmali
        shell: bash
        run: |
          mkdir -p analysis
          unzip -Z1 work/GuiApp.apk | grep -E '^classes([0-9]+)?\.dex$' | sort -V > analysis/dex-list.txt
          test -s analysis/dex-list.txt || { echo "::error::No classes*.dex found"; exit 1; }
          cat > analysis/pom.xml <<'POM'
          <project xmlns="http://maven.apache.org/POM/4.0.0">
            <modelVersion>4.0.0</modelVersion>
            <groupId>local.analysis</groupId>
            <artifactId>outlander-apk-analysis</artifactId>
            <version>1.0</version>
            <dependencies>
              <dependency>
                <groupId>org.smali</groupId>
                <artifactId>baksmali</artifactId>
                <version>2.5.2</version>
              </dependency>
              <dependency>
                <groupId>org.smali</groupId>
                <artifactId>smali</artifactId>
                <version>2.5.2</version>
              </dependency>
            </dependencies>
          </project>
          POM
          mvn --batch-mode --quiet -f analysis/pom.xml org.apache.maven.plugins:maven-dependency-plugin:3.8.1:build-classpath -Dmdep.outputFile=classpath.txt
          while IFS= read -r dex; do
            mkdir -p "analysis/raw/$(dirname "$dex")"
            unzip -p work/GuiApp.apk "$dex" > "analysis/raw/$dex"
            name="${dex%.dex}"
            mkdir -p "analysis/smali/$name"
            curl --fail --location --silent --show-error \
              https://repo.maven.apache.org/maven2/org/smali/baksmali/2.5.2/baksmali-2.5.2.jar \
              -o analysis/baksmali.jar
            java -cp "$(cat analysis/classpath.txt)" org.jf.baksmali.Main disassemble "analysis/raw/$dex" -o "analysis/smali/$name"
          done < analysis/dex-list.txt
          {
            echo "APK SHA-256:"
            sha256sum work/GuiApp.apk
            echo
            echo "DEX files:"
            cat analysis/dex-list.txt
            echo
            echo "Target classes:"
            find analysis/smali -type f | grep -E 'EntDab(Library|Model|PresetController|PresetList)|HardKey' | sort || true
          } > analysis/REPORT.txt

      - name: Patch DAB steering-wheel preset selection
        shell: bash
        run: |
          python tools/patch_dab_presets.py analysis/smali/classes
          java -cp "$(cat analysis/classpath.txt)" org.jf.smali.Main assemble analysis/smali/classes -o analysis/classes-patched.dex

      - name: Create unsigned validation APK
        shell: bash
        run: |
          cp work/GuiApp.apk analysis/GuiApp-patched-unsigned.apk
          zip -q -d analysis/GuiApp-patched-unsigned.apk 'META-INF/*' || true
          mkdir -p analysis/repacked
          cp analysis/classes-patched.dex analysis/repacked/classes.dex
          (cd analysis/repacked && zip -q -u ../GuiApp-patched-unsigned.apk classes.dex)
          unzip -t analysis/GuiApp-patched-unsigned.apk
          {
            echo "Patch: DAB hard forward/back short press now selects next/previous occupied preset"
            echo "Preset range: 1..18 (three banks, six positions each)"
            echo "Current preset subject: 0x101d9"
            echo "Preset list subject: 0x101ee"
            echo "Original APK SHA-256:"
            sha256sum work/GuiApp.apk
            echo "Patched classes.dex SHA-256:"
            sha256sum analysis/classes-patched.dex
            echo "Patched APK SHA-256:"
            sha256sum analysis/GuiApp-patched-unsigned.apk
            echo
            echo "This APK is deliberately unsigned: changing classes.dex invalidates the original signature."
            echo "It is a validation artifact only, not ready to install or flash."
          } > analysis/patch-report.txt

      - name: Upload disassembly for review
        uses: actions/upload-artifact@v4
        with:
          name: outlander-sda-smali-analysis
          path: |
            analysis/REPORT.txt
            analysis/dex-list.txt
            analysis/smali/
          retention-days: 7

      - name: Upload unsigned validation build
        uses: actions/upload-artifact@v4
        with:
          name: outlander-sda-dab-patch-preview
          path: |
            analysis/GuiApp-patched-unsigned.apk
            analysis/classes-patched.dex
            analysis/patch-report.txt
            tools/patch_dab_presets.py
          retention-days: 7
